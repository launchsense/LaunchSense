name: Bug report
description: Something in the scan, the report, or the site is wrong
title: "[bug] "
labels: ["type/bug", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste a real secret. Report shapes only (rule id, path, line).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Scan id, rule id, path and line. Never a secret value or file body.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, analyzer, security, skills, ci]
    validations:
      required: true
  - type: checkboxes
    id: honest
    attributes:
      label: Before you post
      options:
        - label: This report contains no secret value and no raw file text.
          required: true
