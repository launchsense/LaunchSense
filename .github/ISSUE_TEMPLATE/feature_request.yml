name: Feature request
description: Suggest a check, a surface, or a change to the report
title: "[feature] "
labels: ["type/feature", "status/needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a builder cannot find out today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: A fixed check always decides findings. Describe the check, not a prompt for a model.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, analyzer, security, skills, ci]
    validations:
      required: true
