name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: the DCO gate walks origin/main..HEAD, and a shallow
      # checkout has no base to walk from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The MCP red-checks build the Go server with GOPROXY=off, so its modules
      # must already be in the module cache. A fresh runner starts with an empty
      # cache, which is why this job was red on every run while it passed on a
      # developer machine that had built the server before. Populate the cache
      # first, using the version the module asks for.
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
          cache-dependency-path: mcp/go.sum
      - run: cd mcp && go mod download
      - run: npm ci
      - run: npm run check
